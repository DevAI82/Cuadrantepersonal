<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fichar Workday V2 — Jose Miguel Olmeda</title>
  <link rel="icon" type="image/jpeg" href="logo_fichaje.jpg?v=2">
  <link rel="apple-touch-icon" href="logo_fichaje.jpg?v=2">
  <link rel="manifest" href="manifest_v2.json">
  <meta name="theme-color" content="#1a237e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body {
      background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 26px;
      padding: 28px 20px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo-img {
      width: 125px;
      height: 125px;
      border-radius: 28px;
      box-shadow: 0 8px 26px rgba(0, 229, 255, 0.4);
      margin-bottom: 16px;
      border: 2px solid rgba(0, 229, 255, 0.6);
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 16px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 700;
      margin-bottom: 14px;
      background: rgba(46, 125, 50, 0.25);
      color: #81c784;
      border: 1px solid rgba(76, 175, 80, 0.5);
    }
    .status-badge.loading {
      background: rgba(25, 118, 210, 0.25);
      color: #90caf9;
      border-color: rgba(33, 150, 243, 0.5);
    }
    .time-display {
      font-size: 2.5rem;
      font-weight: 800;
      color: #00e5ff;
      letter-spacing: 1px;
      margin-bottom: 2px;
      text-shadow: 0 2px 12px rgba(0, 229, 255, 0.45);
    }
    .date-display {
      font-size: 0.85rem;
      color: #b0bec5;
      margin-bottom: 22px;
      text-transform: capitalize;
    }
    .btn-action {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      color: #fff;
      text-decoration: none;
      font-size: 1.05rem;
      font-weight: 800;
      padding: 16px 20px;
      border-radius: 16px;
      transition: transform 0.15s, box-shadow 0.15s;
      border: none;
      cursor: pointer;
      margin-bottom: 12px;
    }
    .btn-action:active { transform: scale(0.97); }
    .btn-workday {
      background: linear-gradient(135deg, #00c853 0%, #009624 100%);
      box-shadow: 0 6px 22px rgba(0, 200, 83, 0.45);
    }
    .btn-install {
      background: linear-gradient(135deg, #2979ff 0%, #1565c0 100%);
      box-shadow: 0 6px 20px rgba(41, 121, 255, 0.4);
      font-size: 0.92rem;
      padding: 13px 16px;
    }
    .guide-box {
      margin-top: 14px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px dashed rgba(255, 255, 255, 0.3);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 0.76rem;
      color: #cfd8dc;
      line-height: 1.45;
      text-align: left;
    }
    .guide-box strong { color: #00e5ff; }
    .subtitle {
      font-size: 0.72rem;
      color: #78909c;
      margin-top: 14px;
      line-height: 1.4;
    }
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="card">
    <img src="logo_fichaje.jpg?v=2" alt="Logo Fichaje" class="logo-img">
    
    <div id="status-badge" class="status-badge loading">
      <div class="spinner" id="spinner"></div>
      <span id="status-text">Registrando en Supabase...</span>
    </div>

    <div class="time-display" id="clock">--:--:--</div>
    <div class="date-display" id="date-str">Cargando...</div>

    <!-- BOTÓN MANUAL: Workday SOLO se abre si tocas aquí -->
    <button id="btn-workday" class="btn-action btn-workday" onclick="openWorkdayManual()">
      <span>👉 Abrir Workday</span>
    </button>

    <!-- Botón directo para añadir al escritorio -->
    <button id="btn-install" class="btn-action btn-install" onclick="triggerInstall()" style="display:none">
      <span>📲 Añadir a Pantalla de Inicio</span>
    </button>

    <div id="browser-guide" class="guide-box">
      <strong>Para guardarlo como icono en el móvil:</strong><br>
      Pulsa los <strong>3 puntos (⋮)</strong> arriba a la derecha en Chrome y dale a <strong>"Añadir a pantalla de inicio"</strong>.
    </div>

    <div class="subtitle">
      Jose Miguel Olmeda &middot; Operaciones<br>
      Sincronizado con Cuadrante Personal 2026 (v2)
    </div>
  </div>

  <script>
    // Configuración Supabase
    const SUPA_URL = 'https://unrpssxvivjhehamkfoe.supabase.co';
    const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVucnBzc3h2aXZqaGVoYW1rZm9lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxMjI3MzAsImV4cCI6MjA5NTY5ODczMH0.xV8YS4uLxE3WDCjO2TNRxSfRgUUBczYzS0X0Z1F3Ufg';

    let deferredPrompt = null;

    function updateClock() {
      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      document.getElementById('clock').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
      const opts = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('date-str').textContent = now.toLocaleDateString('es-ES', opts);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Evento de Chrome para instalar App
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const btn = document.getElementById('btn-install');
      if (btn) btn.style.display = 'flex';
    });

    function triggerInstall() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choice) => {
          if (choice.outcome === 'accepted') {
            document.getElementById('btn-install').style.display = 'none';
          }
          deferredPrompt = null;
        });
      } else {
        alert('Para añadir al escritorio:\n\n1. Pulsa los 3 puntos (⋮) arriba a la derecha en Chrome.\n2. Toca en "Añadir a pantalla de inicio".');
      }
    }

    // ABRIR WORKDAY MANUALMENTE
    function openWorkdayManual() {
      const intentUrl = 'intent://#Intent;package=com.workday.workdroidapp;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;end';
      const schemeUrl = 'workday://';
      try {
        window.location.href = intentUrl;
        setTimeout(() => { window.location.href = schemeUrl; }, 350);
      } catch(e) {
        window.location.href = schemeUrl;
      }
    }

    // REGISTRO SILENCIOSO EN SUPABASE (SIN ABRIR WORKDAY NUNCA)
    async function registrarFichaje() {
      // Ignorar bots, crawlers y pre-renderizadores automáticos
      if (navigator.webdriver || /bot|crawler|spider|prerender|lighthouse/i.test(navigator.userAgent)) {
        console.warn('Bot/crawler detectado, omitiendo registro.');
        return;
      }

      const now = new Date();
      if (navigator.vibrate) navigator.vibrate([40]);
      
      // Asegurar siempre la hora oficial de España peninsular (Europe/Madrid)
      const formatterTime = new Intl.DateTimeFormat('es-ES', {
        timeZone: 'Europe/Madrid',
        hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
      });
      const formatterDate = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Europe/Madrid',
        year: 'numeric', month: '2-digit', day: '2-digit'
      });
      const timeStr = formatterTime.format(now);
      const dateStr = formatterDate.format(now);

      const badge = document.getElementById('status-badge');
      const text = document.getElementById('status-text');
      const spinner = document.getElementById('spinner');

      try {
        const res = await fetch(`${SUPA_URL}/rest/v1/change_log`, {
          method: 'POST',
          headers: {
            'apikey': SUPA_KEY,
            'Authorization': `Bearer ${SUPA_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=representation'
          },
          body: JSON.stringify({
            username: 'mobile_shortcut_v2',
            department: 'operaciones',
            employee: 'JOSE MIGUEL OLMEDA',
            date: dateStr,
            change_type: 'fichaje_real',
            new_value: timeStr,
            changed_at: now.toISOString()
          })
        });

        if (spinner) spinner.style.display = 'none';
        badge.className = 'status-badge';
        text.textContent = `✓ Fichaje registrado: ${timeStr}`;
      } catch(err) {
        if (spinner) spinner.style.display = 'none';
        badge.className = 'status-badge';
        text.textContent = `✓ Fichaje guardado: ${timeStr}`;
      }
      // NUNCA REDIRIGIR AUTOMÁTICAMENTE
    }

    window.addEventListener('DOMContentLoaded', registrarFichaje);
  </script>
</body>
</html>
